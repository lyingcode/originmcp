# Test configuration - disable database and dynamic tools
spring.main.web-application-type=none

# Disable MyBatis DataSource auto-configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MyBatis Configuration - use H2 for tests
mybatis.mapper-locations=
mybatis.type-aliases-package=

# Dynamic Tool Registry - disabled for tests
tool.registry.enabled=false
