spring.application.name=originmcp

# Disable web server for MCP stdio transport
spring.main.web-application-type=none

# MCP Server Configuration - STDIO Transport
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=weather-mcp-server
spring.ai.mcp.server.version=1.0.0

# Disable Spring Boot banner to avoid JSON parsing errors in MCP clients
spring.main.banner-mode=off

# Configure logging to use stderr, keeping stdout clean for MCP JSON-RPC
# MCP clients only read stdout for JSON-RPC messages, stderr is safe for logs
logging.config=classpath:logback-spring.xml

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/originmcp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.bitsoft.originmcp.model.database
mybatis.configuration.map-underscore-to-camel-case=true

# Dynamic Tool Registry Configuration
tool.registry.enabled=true
tool.registry.refresh-interval=60000
