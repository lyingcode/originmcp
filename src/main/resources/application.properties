spring.application.name=originmcp

# Enable servlet web server for MCP HTTP transport
spring.main.web-application-type=servlet

# HTTP Server Configuration
server.port=8080
mcp.http.endpoint=/origin/mcp

# CORS Configuration
mcp.http.cors.allowed-origins=*
mcp.http.cors.allowed-methods=GET,POST,OPTIONS
mcp.http.cors.allowed-headers=Content-Type,X-API-Key

# Enable Spring AI MCP Server with WebMVC transport
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=origin-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.capabilities.tools=true
spring.ai.mcp.server.capabilities.resources=false
spring.ai.mcp.server.capabilities.prompts=false

# SSE endpoint configuration
spring.ai.mcp.server.sse-endpoint=/origin/mcp
spring.ai.mcp.server.sse-message-endpoint=/origin/mcp/message

# Tool callback provider
spring.ai.mcp.server.tool.callback-provider=toolCallbackProvider

# Disable custom stateless HTTP router (using Spring AI auto-config)
mcp.custom.router.enabled=false

# Disable Spring Boot banner to avoid JSON parsing errors in MCP clients
spring.main.banner-mode=off

# Configure logging to use stderr, keeping stdout clean for MCP JSON-RPC
# MCP clients only read stdout for JSON-RPC messages, stderr is safe for logs
logging.config=classpath:logback-spring.xml

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/originmcp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MCP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Initialization - create tables on startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# HikariCP Connection Pool - startup validation
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.bitsoft.originmcp.model.database
mybatis.configuration.map-underscore-to-camel-case=true

# Dynamic Tool Registry Configuration
tool.registry.enabled=true
tool.registry.refresh-interval=60000

# MCP Security Configuration
mcp.security.enabled=true
mcp.security.api-key-header=X-API-Key
mcp.security.rate-limit.default=60
mcp.security.rate-limit.window-seconds=60

# AES Encryption Configuration (for sensitive values)
mcp.security.encrypt.enabled=true
mcp.security.encrypt.algorithm=AES
mcp.security.encrypt.key-env=MCP_ENCRYPT_KEY
